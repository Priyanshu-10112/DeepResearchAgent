spring.application.name=DeepResearchAgent

spring.datasource.url=jdbc:mysql://localhost:3306/deep_agent
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Server Configuration
server.port=8080

# API Keys (set these as environment variables)
news.api.key=${NEWS_API_KEY}
news.api.url=https://newsapi.org

serp.api.key=${SERP_API_KEY}
serp.api.url=https://serpapi.com/search

reddit.client.id=${REDDIT_CLIENT_ID}
reddit.client.secret=${REDDIT_CLIENT_SECRET}
reddit.username=${REDDIT_USERNAME}
reddit.password=${REDDIT_PASSWORD}

# ArXiv API Configuration
arxiv.api.base-url=https://export.arxiv.org/api/query
arxiv.api.max-results=10

# Logging Configuration
logging.level.root=INFO
logging.level.com.priyanshu.deepresearchagent=DEBUG

# OpenAlex API
openalex.api.url=https://api.openalex.org
openalex.api.mailto=${OPENALEX_MAILTO}

# OpenAI API
openai.api.key=${OPENAI_API_KEY}
openai.api.url=https://api.openai.com/v1/chat/completions
